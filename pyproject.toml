[project]
name = "agent-treasury"
version = "0.1.0"
description = "Policy-controlled Stripe test-mode payments driven by changing inputs"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "pydantic>=2.7",
  "dbos>=1.14",
  "stripe>=11",
  "anthropic>=1.14.0",
  "cognee>=1.6.4",
  "python-dotenv>=1.2.4",
]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.6"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["src/treasury"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
package = true
