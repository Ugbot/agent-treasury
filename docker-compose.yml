services:
  api:
    build: .
    env_file:
      - path: .env
        required: false
    environment:
      TREASURY_DB: /data/treasury.sqlite
      TREASURY_DBOS_DB: /data/treasury_dbos.sqlite
    volumes:
      - treasury-data:/data
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:8000/health')"]
      interval: 15s
      timeout: 3s
      retries: 5
  web:
    build: ./frontend
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "8080:80"
volumes:
  treasury-data:
